name: Cross-platform ACP checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test without Hermes, OpenCode, credentials, or model requests
        run: python -m unittest discover -s tests -v
  cli-smoke:
    name: Real OpenCode ACP (${{ matrix.os }}, no inference)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Verify the runner's npm prerequisite
        run: npm --version
      - name: Install the pinned official CLI in a job-local directory
        run: npm install --prefix .opencode-runtime --no-audit --no-fund @opencode/cli@2.1.2
      - name: Verify actual npm launcher, ACP handshake and free-model/Build selection
        run: python tests/smoke_cli.py --npm-prefix .opencode-runtime
